def ReifiedMatrices = ['T', 'Double', 'Float', 'Int']
def ReifiedNDArrays = ['T', 'Double', 'Float', 'Long', 'Int', 'Short', 'Byte']
def NumericalConstantSuffixes = [
    'T': ' as T',
    'Double': '.0',
    'Float': '.0f',
    'Long': 'L',
    'Int': '',
    'Short': '.toShort()',
    'Byte': '.toByte()'
]

buildscript {
    ext.kotlin_version = '1.9.22'
    ext.project_version = '0.12'

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// --- koma-core-api: Multiplatform module with common + JVM + JS targets ---
// The old project had separate projects for common/jvm/js with 'expectedBy'.
// Modern KMP puts them all in a single multiplatform project.
project(':koma-core-api') {
    apply plugin: 'org.jetbrains.kotlin.multiplatform'

    repositories {
        mavenCentral()
    }

    kotlin {
        jvm()
        js {
            browser()
            nodejs()
        }
        sourceSets {
            commonMain {
                kotlin.srcDirs = [
                    "${project.projectDir}/common/src",
                    "${project.projectDir}/common/srcgen"
                ]
                dependencies {
                    implementation "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlin_version"
                }
            }
            jvmMain {
                kotlin.srcDirs = ["${project.projectDir}/jvm/src"]
                dependencies {
                    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
                }
            }
            jsMain {
                kotlin.srcDirs = ["${project.projectDir}/js/src"]
                dependencies {
                    implementation "org.jetbrains.kotlin:kotlin-stdlib-js:$kotlin_version"
                }
            }
        }
    }
}

